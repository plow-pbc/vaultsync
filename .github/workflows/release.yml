name: Release
on:
  push:
    tags: ['v*']
  # Build (but don't publish) when the release pipeline itself changes.
  pull_request:
    paths: ['.github/workflows/release.yml', 'install.sh']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Linux builds link against glibc 2.31 so one binary runs on older
      # distributions and Raspberry Pi OS alike.
      - if: runner.os == 'Linux'
        run: |
          pip install ziglang
          cargo install --locked cargo-zigbuild
          cargo zigbuild --locked --release --target ${{ matrix.target }}.2.31
      - if: runner.os == 'macOS'
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        run: |
          name=vaultsync-${{ matrix.target }}.tar.gz
          tar -czf "$name" -C target/${{ matrix.target }}/release vaultsync
          shasum -a 256 "$name" > "$name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: vaultsync-${{ matrix.target }}
          path: vaultsync-${{ matrix.target }}.tar.gz*

  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, install-script]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* install.sh --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
