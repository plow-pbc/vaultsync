name: Release
on:
  push:
    tags: ['v*']
  # Build (but don't publish) when the release pipeline itself changes.
  pull_request:
    paths: ['.github/workflows/release.yml', 'install.sh']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Linux builds link against glibc 2.31 so one binary runs on older
      # distributions and Raspberry Pi OS alike.
      - if: runner.os == 'Linux'
        run: |
          pip install ziglang
          cargo install --locked cargo-zigbuild
          cargo zigbuild --locked --release --target ${{ matrix.target }}.2.31
      - if: runner.os == 'macOS'
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        run: |
          name=vaultsync-${{ matrix.target }}.tar.gz
          tar -czf "$name" -C target/${{ matrix.target }}/release vaultsync
          shasum -a 256 "$name" > "$name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: vaultsync-${{ matrix.target }}
          path: vaultsync-${{ matrix.target }}.tar.gz*

  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh

  # The menu-bar app, signed and notarized: one job, on release tags only.
  # Skipped, and the release published without it, until the repository has
  # the Developer ID certificate and notary secrets.
  app:
    runs-on: macos-15
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: 3559PD337Z
    steps:
      - uses: actions/checkout@v4
      # build.sh builds the engine library for both Mac targets.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build BrainSync by Plow (signed and notarized when the secrets exist)
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::notice::no signing secrets; the app is ad-hoc signed"
            SIGN=- macos/build.sh
            mkdir dist && cp macos/build/BrainSync-by-Plow.dmg dist/
            (cd dist && shasum -a 256 BrainSync-by-Plow.dmg > BrainSync-by-Plow.dmg.sha256)
            exit 0
          fi
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          macos/build.sh
          mkdir dist && cp macos/build/BrainSync-by-Plow.dmg dist/
          (cd dist && shasum -a 256 BrainSync-by-Plow.dmg > BrainSync-by-Plow.dmg.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: BrainSync-app
          path: dist/BrainSync-by-Plow.dmg*

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, install-script, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* install.sh --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
