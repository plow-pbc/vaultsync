# The Mac app links the engine as a static library, so CodeQL's automatic
# build can't compile it: build the library first, then the app.
name: CodeQL (Swift)
on:
  push:
    branches: [main]
    paths: ['macos/**', 'crates/**', 'Cargo.*', '.github/workflows/codeql-swift.yml']
  pull_request:
    paths: ['macos/**', 'crates/**', 'Cargo.*', '.github/workflows/codeql-swift.yml']
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: macos-15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # Both architectures, as build.sh makes it: CodeQL's traced Swift build
      # links for x86_64 even on an arm64 runner.
      - name: Engine library
        env:
          MACOSX_DEPLOYMENT_TARGET: '14.0'
        run: |
          mkdir -p macos/lib
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p vaultsync-ffi --target "$target"
          done
          lipo -create -output macos/lib/libvaultsync_ffi.a \
            target/aarch64-apple-darwin/release/libvaultsync_ffi.a \
            target/x86_64-apple-darwin/release/libvaultsync_ffi.a
      - uses: github/codeql-action/init@v3
        with:
          languages: swift
          build-mode: manual
      - name: Build the app
        working-directory: macos
        run: swift build -c release
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:swift
